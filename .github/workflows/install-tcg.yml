# A whole Lubuntu desktop installation with no KVM. Deliberately not on push:
# desktop package downloads and emulation can take a long time, so it
# runs when a tag says the repo is claiming to be good, plus a manual button for the
# times you want the proof without cutting a release.
name: emulated installation (tags)
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  install:
    name: Lubuntu 26.04 installed under TCG
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - name: Make room for a 2.7 GB ISO and a growing qcow2
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Install prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qemu-system-x86 qemu-utils xorriso genisoimage openssl curl
      - name: Configure an ephemeral lab
        run: |
          cp .env.example .env
          # Emulated, no graphical console, and a throwaway password: this guest dies
          # with the runner and never accepts it over SSH anyway.
          sed -i -e 's/^LAB_ACCEL=.*/LAB_ACCEL=tcg/' \
                 -e 's/^LAB_VNC_PORT=.*/LAB_VNC_PORT=0/' \
                 -e 's/^LAB_PASSWORD=.*/LAB_PASSWORD=Ephemeral-0001/' \
                 -e 's/^LAB_INSTALL_TIMEOUT=.*/LAB_INSTALL_TIMEOUT=18000/' \
                 -e 's/^LAB_READY_TIMEOUT=.*/LAB_READY_TIMEOUT=1800/' .env
          chmod 600 .env
          ./lab config show
      - name: Download and verify the pinned ISO
        run: ./lab iso lubuntu-26.04 download
      - name: Install unattended and verify the graphical desktop over SSH
        run: ./lab up lubuntu-26.04 --foreground
      - name: Show the installed version and stop
        run: |
          ./lab ssh lubuntu-26.04 -- 'uname -a'
          ./lab stop lubuntu-26.04
      - name: Evidence, whatever the outcome
        if: always()
        run: ./lab report lubuntu-26.04 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulated-install-evidence
          path: |
            out/
            work/lubuntu-26.04/serial.log
            work/lubuntu-26.04/logs/
            work/lubuntu-26.04/events.jsonl

name: lightweight checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: bash -n lab scripts/menu.sh
      - run: shellcheck lab scripts/menu.sh
      - run: ./lab up ubuntu-26.04 --dry-run
      - run: ./lab install windows-11 --dry-run
